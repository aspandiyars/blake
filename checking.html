<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BLAKE</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-image {
      width: 180px; 
      height: auto;
      animation: rotate 1s linear infinite; 
    }
    @media (max-width: 1000px) {
      .rotating-image {
      width: 400px; 
    }
    }
  </style>
</head>
<body>
  <img src="img/checking.png" class="rotating-image">
  <script>
    history.back();
  </script>
  <script>
    window.history.pushState({}, '', '/');
  </script>
</body>
</html>
